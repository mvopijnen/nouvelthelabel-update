name: Theme validation
on:
  pull_request:
  push:
    branches: [main, fix/production-readiness-round-2]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/benchmark-transitions.cjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run theme-check
        env:
          SHOPIFY_CLI_NO_ANALYTICS: '1'
      - run: npm run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: shopify-theme-and-checks
          path: artifacts/
